<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="roundedIcon" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="200" height="200" rx="34" />
    </clipPath>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.6" fill="#ffffff" />
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c3140" />
      <stop offset="1" stop-color="#5b3f9e" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ded9cf" />
    </linearGradient>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
    </filter>
  </defs>

  <g clip-path="url(#roundedIcon)">
    <rect width="200" height="200" fill="url(#bgGrad)" />
    <circle cx="172" cy="28" r="70" fill="url(#halftone)" opacity="0.10" />
  </g>

  <!-- soft drop shadow of the pin -->
  <g filter="url(#softBlur)" opacity="0.40">
    <path d="M100,42 C77,42 58,60 58,83 C58,116 100,163 100,163 C100,163 142,116 142,83 C142,60 123,42 100,42 Z"
          fill="#000000" transform="translate(0,7)" />
  </g>

  <!-- pin body -->
  <path d="M100,42 C77,42 58,60 58,83 C58,116 100,163 100,163 C100,163 142,116 142,83 C142,60 123,42 100,42 Z"
        fill="url(#pinGrad)" stroke="#c9c3b6" stroke-width="1.5" />

  <!-- hub / red inside the pin head: nodo central + 3 puntos conectados -->
  <g stroke="#2c3140" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="83" x2="100" y2="67" />
    <line x1="100" y1="83" x2="113.9" y2="91" />
    <line x1="100" y1="83" x2="86.1" y2="91" />
  </g>
  <circle cx="100" cy="67" r="6" fill="#5b3f9e" />
  <circle cx="113.9" cy="91" r="6" fill="#5b3f9e" />
  <circle cx="86.1" cy="91" r="6" fill="#5b3f9e" />
  <circle cx="100" cy="83" r="9" fill="#2c3140" />
</svg>
