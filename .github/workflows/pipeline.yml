name: Pipeline Hub Cultural DU

# Disparo manual únicamente (botón "Run workflow" en la pestaña Actions de
# GitHub) — a propósito, para no gastar presupuesto de HikerAPI/Groq/Cerebras
# sin que alguien lo decida explícitamente cada vez.
on:
  workflow_dispatch:
    inputs:
      run_extraction_and_ingestion:
        description: "Fase 1+2 — Scraping HikerAPI + ingestión a Neo4j (acopladas: data_raw/ está en .gitignore, no persiste entre corridas, así que ingestión solo tiene sentido si se acaba de scrapear en esta misma corrida)"
        type: boolean
        default: false
      run_analysis:
        description: "Fase 3 — 3_analyze_network.py run-all (igraph/leidenalg local, no GDS)"
        type: boolean
        default: true
      run_manual_categorization:
        description: "Fase 4 — load_manual_account_categorization.py (sube cuentas_instagram_completo_v4.xlsx a Neo4j; solo tiene efecto si ese archivo cambió)"
        type: boolean
        default: false
      run_events:
        description: "Fase 5 — 4_enrich_events_extract.py + 4_enrich_events_resolve.py"
        type: boolean
        default: true
      run_geo:
        description: "Fase 6 — 4_enrich_locations.py (Nominatim)"
        type: boolean
        default: true
      run_capa3_backfill:
        description: "backfill_events_capa3.py — catch-up de eventos con Capa 3 pendiente"
        type: boolean
        default: false
      llm_provider:
        description: "Proveedor LLM para Capa 3 (Groq gratis primero, cae a Cerebras si se agota)"
        type: choice
        options: [groq, cerebras]
        default: groq

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      HIKERAPI_ACCESS_KEY: ${{ secrets.HIKERAPI_ACCESS_KEY }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      LLM_PROVIDER: ${{ inputs.llm_provider }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del pipeline
        run: pip install -r requirements.txt

      # ── Fase 1+2 ────────────────────────────────────────────────────────
      - name: "Fase 1 — Extracción Instagram (HikerAPI, DD-076)"
        if: inputs.run_extraction_and_ingestion == 'true'
        # Topes de gasto duros por corrida (--max-usd). data_raw/ no persiste
        # entre corridas de CI, así que cada corrida parte de cero.
        run: |
          python 1_harvest_ig_profiles_hikerapi.py harvest --seeds config/seeds_idf.json --yes --max-usd 0.5
          python 1_harvest_ig_posts_hikerapi.py harvest --seeds config/seeds_idf.json --max-days 10 --yes --max-usd 1.5

      - name: "Fase 2 — Ingestión a Neo4j"
        if: inputs.run_extraction_and_ingestion == 'true'
        run: python 2_build_graph.py

      # ── Fase 3 ──────────────────────────────────────────────────────────
      - name: "Fase 3 — Análisis de red (igraph/leidenalg)"
        if: inputs.run_analysis == 'true'
        run: python 3_analyze_network.py run-all

      # ── Fase 4 ──────────────────────────────────────────────────────────
      - name: "Fase 4 — Categorización manual (spreadsheet curado → Neo4j)"
        if: inputs.run_manual_categorization == 'true'
        run: python load_manual_account_categorization.py

      # ── Fase 5 ──────────────────────────────────────────────────────────
      - name: "Fase 5-A — Extracción de eventos"
        if: inputs.run_events == 'true'
        run: python 4_enrich_events_extract.py

      - name: "Fase 5-B — Deduplicación de eventos"
        if: inputs.run_events == 'true'
        run: python 4_enrich_events_resolve.py

      # ── Fase 6 ──────────────────────────────────────────────────────────
      - name: "Fase 6 — Geocodificación"
        if: inputs.run_geo == 'true'
        run: python 4_enrich_locations.py

      # ── Backfill puntual ────────────────────────────────────────────────
      - name: "Backfill Capa 3 pendiente"
        if: inputs.run_capa3_backfill == 'true'
        run: python backfill_events_capa3.py

      # ── Refrescar el sitio ──────────────────────────────────────────────
      # NOTA (2026-08-15): el paso que reiniciaba el dashboard Dash en Render
      # se retiró — ese dashboard fue reemplazado por el sitio estático en
      # Cloudflare (site/, ver DD-044/DD-045). El sitio nuevo se refresca
      # corriendo `python 5_export_dashboard_data.py` (pisa site/data.json)
      # y haciendo push a master; Cloudflare Workers Builds redespliega solo
      # — no depende de este workflow. Ese paso automático quedó fuera del
      # alcance de este job a propósito, por ahora es manual.
